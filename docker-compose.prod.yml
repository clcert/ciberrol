# Producción con caddy-docker-proxy (https://github.com/lucaslorentz/caddy-docker-proxy).
# No incluye Caddy: el proxy ya existente lee los labels de "app" y publica el dominio con HTTPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requiere en .env: DOMAIN y (opcional) CADDY_NETWORK, POSTGRES_*.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ciberrol}
      POSTGRES_USER: ${POSTGRES_USER:-ciberrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ciberrol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ciberrol}
      COOKIE_SECURE: "true"
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - caddy
    labels:
      caddy: ${DOMAIN:?Define DOMAIN en .env}
      caddy.encode: gzip
      caddy.reverse_proxy: "{{upstreams 8000}}"

volumes:
  pgdata:

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
